[project]
name = "datafusion-accelerated-mlx"
version = "0.0.1"
description = "Experimental: compact-array execution of DataFusion plans, with MLX on Apple's GPUs. Retires stage by stage as DataFusion Accelerated's milestones land."
readme = "README.md"
license = "Apache-2.0"
authors = [
    { name = "Alexander Sky Merose", email = "al@merose.com" },
    { name = "Ray Cromwell" },
]
requires-python = ">=3.12"
dependencies = [
    # DenseProgram walks datafusion-python's logical plans.
    "datafusion==55.0.0",
    # ddx differentiates the SQL the executors run: ddxdb.to_sql from
    # 0.4.11, and ddxdb.ad.dataframe from 0.4.12 (ddx#291).
    "ddxdb[datafusion]==0.4.12",
    # einfold finds array operations in the plans. 0.3.0rc1 has the dense
    # backend (einfold#167), and resets a decoded plan's state (#164).
    # TODO: pin 0.3.0 once it's released.
    "einfold[datafusion]==0.3.0rc1",
    # MLX, Apple's array library. On Linux, its CPU backend runs the same
    # code, so the tests need no Apple hardware.
    "mlx==0.32.4; sys_platform == 'darwin'",
    "mlx[cpu]==0.32.4; sys_platform == 'linux'",
    "numpy",
    "pyarrow",
    # The executors run on an xarray-sql Context, through the records it
    # made public in 0.8.0 (xarray-sql#323).
    "xarray-sql==0.8.0",
]

[project.optional-dependencies]
# An exact erf; without it, DenseProgram falls back to math.erf.
scipy = ["scipy"]

[dependency-groups]
dev = [
    "pytest",
    # Two tests read xarray Datasets.
    "xarray",
]

[build-system]
# maturin builds the native module, datafusion_accelerated_mlx._native, from
# the Rust in rust/ (Cargo.toml).
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "src"
module-name = "datafusion_accelerated_mlx._native"
features = ["pyo3/extension-module"]
