name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel a run when a newer push to the same ref supersedes it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  reuse:
    name: REUSE compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  rust:
    name: Rust (${{ matrix.os }}, ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        # ARM Linux from the start, since the first release ships ARM wheels
        # (design §12.1).
        os: [ubuntu-latest, ubuntu-24.04-arm]
        # "1.94" is the minimum supported version, rust-version in Cargo.toml.
        rust: [stable, "1.94"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # rustfmt.toml's settings need a nightly rustfmt, pinned so that a
      # nightly change doesn't fail a PR. It's installed first, so the
      # matrix's toolchain, installed next, is the default.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        if: matrix.rust == 'stable'
        with:
          toolchain: nightly-2026-10-10
          components: rustfmt
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: ${{ matrix.rust }}
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.rust }}
      - name: rustfmt
        if: matrix.rust == 'stable'
        run: cargo +nightly-2026-10-10 fmt --all --check
      - name: clippy
        if: matrix.rust == 'stable'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: docs
        if: matrix.rust == 'stable'
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: tests
        run: cargo test --workspace --no-fail-fast

  # The experimental MLX package (issue #41). Its tests need no Apple
  # hardware.
  mlx:
    name: experimental/mlx (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The package's native module is Rust, built by maturin when uv
      # installs the package. Its checks are the workspace's.
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: nightly-2026-10-10
          components: rustfmt
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: experimental/mlx
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: rustfmt
        run: cargo +nightly-2026-10-10 fmt --manifest-path experimental/mlx/Cargo.toml --check
      - name: clippy
        run: cargo clippy --manifest-path experimental/mlx/Cargo.toml --all-targets -- -D warnings
      # The test binaries link libpython, as pyo3 does without
      # extension-module, so they run against uv's CPython 3.12.
      - name: Rust tests
        run: |
          uv python install 3.12
          export PYO3_PYTHON="$(uv python find 3.12)"
          export LD_LIBRARY_PATH="$(dirname "$(dirname "$PYO3_PYTHON")")/lib"
          cargo test --manifest-path experimental/mlx/Cargo.toml
      - name: tests
        run: uv run --project experimental/mlx --python 3.12 --locked pytest experimental/mlx/tests
