# DataFusion Accelerated's Rust crates. The core, `datafusion-accelerated`,
# depends on DataFusion and on no hardware or vendor library (R13). Each
# integration with a device or a library will be a crate of its own here.
#
# The spikes under docs/spikes/ are not members: each has its own workspace
# and lockfile, so a spike's pins never move the core's.
[workspace]
resolver = "3"
members = ["crates/datafusion-accelerated"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/xqlsystems/datafusion-accelerated"
authors = ["Alexander Sky Merose <al@merose.com>"]
# The minimum supported Rust version, the same as ddx's.
rust-version = "1.94"

[workspace.dependencies]
# Pinned exactly (D15). datafusion-python 55.0.0, the release the Python
# package attaches to, is built on DataFusion 55.1; an extension built on
# 55.2 loads into it (spike 4a). ddx pins 55.2.0 too.
datafusion = "=55.2.0"
datafusion-ffi = "=55.2.0"
datafusion-proto = "=55.2.0"
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

# The Google Rust style guide's rules that clippy and rustc can check
# (https://google.github.io/styleguide/rustguide.html), for every crate.
[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
needless_pass_by_value = "warn"
missing_panics_doc = "warn"
must_use_candidate = "warn"
return_self_not_must_use = "warn"
wildcard_imports = "warn"
# Public enums are #[non_exhaustive], so adding a variant isn't a breaking change.
exhaustive_enums = "warn"
